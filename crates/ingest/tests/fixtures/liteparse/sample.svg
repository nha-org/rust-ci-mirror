<path d="m1646.7 841.9c61.43-38 93.31-106 93.31-153.29v-315.71c0-84.42-100.9-152.9-225.43-152.86h-969.14c-124.5 0-225.4 68.44-225.43 152.86v315.71c0 84.42 100.9 152.9 225.43 152.86h804.81l-88.49 238.57z" fill="#fff" stroke="#000" stroke-width="30"/> 
<switch>
<text x="400" y="500" systemLanguage="en">
  <tspan dy="-50">Love comes</tspan>
  <tspan x="400" dy="200">through the stomach.</tspan>
</text> 
<text x="400" y="500" systemLanguage="bn">
  <tspan dy="-50">ভালবাসা আসে</tspan> 
  <tspan x="400" dy="200">পাকস্থলী দিয়ে</tspan>
</text>
<text x="400" y="500" systemLanguage="bg">
  <tspan dy="-50">Любовта минава</tspan>
  <tspan x="400" dy="200">през стомаха.</tspan>
</text> 
<text x="400" y="500" systemLanguage="ca">
  <tspan dy="-50">L'amor entra</tspan>
  <tspan x="400" dy="200">per l'estòmac.</tspan>
</text> 
<text x="400" y="500" systemLanguage="de">
  <tspan dy="-50">Liebe geht</tspan>
  <tspan x="400" dy="200">durch den Magen.</tspan>
</text> 
<text x="400" y="500" systemLanguage="eo">
 <tspan dy="-50">Amo trapasas</tspan>
 <tspan x="400" dy="200">la stomakon.</tspan>
</text> 
<text x="400" y="500" systemLanguage="es">
  <tspan dy="-50">El amor entra</tspan>
  <tspan x="400" dy="200">por el estómago.</tspan>
</text> 
<text x="400" y="500" systemLanguage="fr">
  <tspan dy="-50">L'amour passe</tspan>
  <tspan x="400" dy="200">par l'estomac.</tspan>
</text> 
<text x="400" y="500" systemLanguage="gu">
  <tspan dy="-50">પ્રેમ</tspan> 
  <tspan x="400" dy="200">પેટ દ્વારા આવે છે</tspan>
</text> 
<text x="400" y="500" systemLanguage="hi">
  <tspan dy="-50">प्यार</tspan> 
  <tspan x="400" dy="200">पेट के माध्यम से आता है ।</tspan>
</text> 
<text x="400" y="500" systemLanguage="it">
 <tspan dy="-50">L'amore passa</tspan>
 <tspan x="400" dy="200">per lo stomaco.</tspan>
</text> 
<text x="400" y="500" systemLanguage="ja">
  <tspan dy="-50">愛をつかむなら</tspan> 
  <tspan x="400" dy="200">胃袋をつかめ</tspan>
</text>
<text x="400" y="500" systemLanguage="ms">
  <tspan dy="-50">Cinta datang</tspan>
  <tspan x="400" dy="200">melalui perut.</tspan>
</text> 
<text x="400" y="500" systemLanguage="nl">
  <tspan dy="-50">Liefde gaat</tspan>
  <tspan x="400" dy="200">door de maag.</tspan>
</text> 
<text x="400" y="500" systemLanguage="pl">
  <tspan dy="-50">Przez żołądek</tspan>
  <tspan x="400" dy="200">do serca.</tspan>
</text>
<text x="400" y="500" systemLanguage="ro">
  <tspan dy="-50">Dragostea trece</tspan>
  <tspan x="400" dy="200">prin stomac.</tspan>
</text>
<text x="400" y="500" systemLanguage="ru">
  <tspan dy="-50">Любовь приходит</tspan> 
  <tspan x="400" dy="200">через желудок.</tspan>
</text>
<text x="400" y="500" systemLanguage="sv" font-size="110">
 <tspan dy="-50">Vägen till en mans hjärta</tspan>
 <tspan x="400" dy="200">går genom magen.</tspan>
</text>
<text x="400" y="500" systemLanguage="th" font-size="140">
  <tspan dy="-50">ความรัก</tspan>
  <tspan x="400" dy="200">ทำให้คนตาบอด</tspan>
</text>
<text x="400" y="500" systemLanguage="tr">
  <tspan dy="-50">Kalbe giden yol</tspan>
  <tspan x="400" dy="200">mideden geçer.</tspan>
</text> 
<text x="400" y="500" systemLanguage="uk">
  <tspan dy="-50">Любов приходить</tspan> 
  <tspan x="400" dy="200">через шлунок.</tspan>
</text>
<text x="400" y="500" systemLanguage="vi">
  <tspan dy="-50">Tình yêu</tspan>
  <tspan x="400" dy="200">tự tận đáy lòng.</tspan>
</text> 
<text x="400" y="500" systemLanguage="zh-cn">
  <tspan dy="-50">想抓住他的心，</tspan> 
  <tspan x="400" dy="200">就先抓住他的胃</tspan>
</text> 
<text x="400" y="500" systemLanguage="zh-tw">
  <tspan dy="-50">想抓住他的心，</tspan> 
  <tspan x="400" dy="200">就先抓住他的胃</tspan>
</text> 
<text x="400" y="500">
  <tspan dy="-50">Love comes</tspan>
  <tspan x="400" dy="200">through the stomach.</tspan>
</text> 
