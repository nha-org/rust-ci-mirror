[package]
name = "dash-ingest"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# an imported image held in its document as a data: URI (rfc-rust-unified section 20i)
base64 = "0.22"
# the one document model (rust/CLAUDE.md rule 7) a source is read into
canvist_model = "=0.2.1"
# web.clj's Jsoup: the HTML reader's tree and selectors, on the html5ever the workspace already builds
dom_query = { version = "=0.29.0", default-features = false }
dash-core.workspace = true
inventory.workspace = true
# graal's pdf.clj reads with PDFium; this reads the text layer in pure Rust, over lopdf, so the Linux CI builds it
pdf-extract = "=0.12.1"
# a page's web and mail addresses, as PDFium's web links find them
regex.workspace = true
serde_json.workspace = true

[dev-dependencies]
dash-meter.workspace = true
