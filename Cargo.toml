# The Rust app of rfc-rust-unified: the hexagonal workspace of section 3, grown slice by slice (CLAUDE.md Coordination 6).
# CI: dash ci mirror rust pushes the files rust/ci-mirror.txt lists to nha-org/rust-ci-mirror, Linux only.
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
dash-core = { path = "crates/core" }
dash-store = { path = "crates/store" }
dash-meter = { path = "crates/meter" }
dash-ext = { path = "crates/ext" }
dash-ingest = { path = "crates/ingest" }
dash-surface = { path = "crates/surface" }
dash-sync = { path = "crates/sync" }
inventory = "0.3.25"
serde_json = "1"

# Tests boot a Steel engine in nearly every process: 1.8 s unoptimized.
[profile.dev.package.steel-core]
opt-level = 1
